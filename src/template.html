<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>
<body>
    <header>
        <h1>My To-Do List</h1>
    </header>

    <main>
        <aside>
            <h2>Projects</h2>
            <div id="projectDisplay"></div>
            <button id="showProjectForm">+ Add Project</button>
        </aside>

        <section>
            <h2 id="todoHeader">Todos</h2>
            <div id="todoDisplay"></div>
            <button id="showTodoForm">+ Add Todo</button>
        </section>
    </main>

    <form id="projectForm" style="display: none;">
        <h3>New Project</h3>
        <input type="text" id="projectName" name="name" placeholder="Project name" required>
        <div>
            <button type="button" id="cancelProject">Cancel</button>
            <input type="submit" value="Create Project">
        </div>
    </form>

    <form id="todoForm" style="display: none;">
        <h3>New Todo</h3>
        <input type="text" id="todoTitle" placeholder="Title" required>
        <input type="date" id="todoDueDate">
        <select id="todoPriority">
            <option value="Low">Low</option>
            <option value="Medium">medium</option>
            <option value="High">High</option>
        </select>
        <textarea id="todoDescription" placeholder="Description..."></textarea>

        <label for="projectSelect">Project:</label>
        <select id="projectSelect"></select>

        <div>
            <button type="button" id="cancelTodo">Cancel</button>
            <input type="submit" value="Create Todo">
        </div>
    </form>
